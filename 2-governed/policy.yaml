# =============================================================================
# OpenShell Sandbox Policy
# Project: Bounded Boxer ("Teach Agents When Not to Act")
#
# Enforces declarative, outside-the-agent runtime boundaries:
#   1. Static Filesystem Isolation (Kernel Landlock LSM / Darwin Seatbelt / VFS Mask):
#      - Allows read-only access to workspace/config and compiled Go binary (./bin)
#      - Masks/Denies workspace/secrets (gcp-sa-key.json is mounted over /dev/null -> 0 bytes)
#   2. Dynamic Default-Deny Network Egress:
#      - Permits local inference traffic to Ollama (127.0.0.1:11434)
#      - Permits internal operations reporting to 127.0.0.1:8080 (/report, /audit-event)
#      - Blocks all other egress, including unauthorized exfiltration to 127.0.0.1:9090/exfil
# =============================================================================
version: 1

metadata:
  name: ops-audit-agent-governed
  description: "Zero-trust runtime boundary for Google ADK (Go) ops agent"

# --- 1. Static Filesystem Policy (Kernel Landlock LSM / VFS Mask) ---
filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /etc
    - /proc
    - ./bin
    - ./workspace/config
  read_write:
    - /tmp
  masked_paths:
    # Explicitly mask sensitive GCP Service Account credentials from the agent's VFS view
    - ./workspace/secrets
    - ./workspace/secrets/gcp-sa-key.json

landlock:
  compatibility: best_effort
  default_access: deny

process:
  run_as_user: sandbox
  run_as_group: sandbox
  no_new_privileges: true

# --- 2. Dynamic Network Policy (Default-Deny Egress) ---
# Any destination host/port not explicitly listed below is blocked at the socket layer.
# Notably, 127.0.0.1:9090 (/exfil) is NOT listed and is blocked by default_egress: deny.
network_policies:
  default_egress: deny

  local_ollama_inference:
    name: allow-local-ollama-inference
    description: "Permit Google ADK (Go) agent to query local Ollama inference server"
    endpoints:
      - host: 127.0.0.1
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/api/*"
          - allow:
              method: POST
              path: "/v1/*"
          - allow:
              method: GET
              path: "/api/tags"
    binaries:
      - path: ./bin/bounded-boxer-agent

  internal_ops_reporting:
    name: allow-internal-ops-report-loopback
    description: "Permit agent to submit sanitized operational diagnostics to internal loopback collector (:8080) while keeping external sinks (:9090) blocked"
    endpoints:
      - host: 127.0.0.1
        port: 8080
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: "/report"
          - allow:
              method: POST
              path: "/audit-event"
    binaries:
      - path: ./bin/bounded-boxer-agent
